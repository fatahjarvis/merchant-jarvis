<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- OLED pure black background -->
  <rect width="512" height="512" rx="104" fill="#030712"/>
  <circle cx="256" cy="240" r="210" fill="url(#cyanGlow)"/>

  <!-- Outer Cyber Ring / Circuit Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#164e63" stroke-width="3" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#shieldBorder)" stroke-width="2" opacity="0.8"/>

  <!-- Jarvis Hex Core -->
  <polygon points="256,120 360,180 360,300 256,360 152,300 152,180" 
           fill="#04121a" stroke="url(#neonTeal)" stroke-width="6" filter="url(#glowEffect)" />

  <!-- Monogram MJ stylized with shop cart / pulse beam -->
  <path d="M 195,290 L 195,210 L 235,260 L 256,235 L 277,260 L 317,210 L 317,290" 
        fill="none" stroke="#22d3ee" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Pulse Orb -->
  <circle cx="256" cy="285" r="12" fill="#22d3ee" filter="url(#glowEffect)"/>
  <circle cx="256" cy="285" r="5" fill="#ffffff"/>

  <!-- Bottom Brand Text Monospace -->
  <text x="256" y="420" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="28" font-weight="bold" letter-spacing="6">M.JARVIS</text>
  <text x="256" y="445" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="14" letter-spacing="2">LOGIXTIX · MU</text>
</svg>
